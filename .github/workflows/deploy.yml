name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'react-app/package-lock.json'
          
      - name: Install dependencies
        run: npm install
        working-directory: ./react-app
        
      - name: Build
        run: npm run build
        working-directory: ./react-app
        env:
          VITE_SUPABASE_URL: 'https://poztpbyzkitozzthfpsb.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable_VTbZfAMbgKBHKe17qC9bmA_BV6A5CPZ'
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './react-app/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
