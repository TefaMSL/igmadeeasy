<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIION Group — Client Portal Login</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 2;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    .login-logo { margin-bottom: 32px; display: inline-block; }
    .login-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 8px;
    }
    .login-desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 32px; }
    
    .error-msg {
      color: var(--rose);
      background: rgba(251, 113, 133, 0.1);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }

    /* Override input margins for form */
    .login-card .form-field { text-align: left; margin-bottom: 24px; }
    .login-card .form-field label { display: block; margin-bottom: 8px; color: var(--text-light); font-size: 0.85rem; font-weight: 600; }
    .login-card input { width: 100%; }
    .login-card .btn { width: 100%; justify-content: center; }

    /* Override custom cursor */
    @media (hover: hover) and (pointer: fine) {
      body, a, input, textarea, select { cursor: auto !important; }
      button, a { cursor: pointer !important; }
    }
  </style>
</head>
<body>
  <!-- Aurora Background -->
  <div class="aurora" aria-hidden="true">
    <div class="aurora-orb"></div>
    <div class="aurora-orb"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <a href="index.html" class="login-logo">
        <img src="logo.png" alt="VIION Group" class="logo-img">
      </a>
      <h1 class="login-title">Client Portal</h1>
      <p class="login-desc">Secure access for hospital IT administrators.</p>
      
      <div id="error-msg" class="error-msg">Invalid email or password.</div>

      <form id="loginForm">
        <div class="form-field">
          <label for="email">Work Email</label>
          <input type="email" id="email" placeholder="admin@hospital.com" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          Sign In
          <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
      </form>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const errorMsg = document.getElementById('error-msg');
      const loginBtn = document.getElementById('loginBtn');

      // Check if already logged in
      if (sessionStorage.getItem('demo_mode') === 'true') {
        window.location.href = 'portal.html';
        return;
      }
      if (supabaseClient) {
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            window.location.href = 'portal.html';
          }
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // DEMO MODE BYPASS
        if (email === 'admin@viiongroup.com' && password === 'demo123') {
          sessionStorage.setItem('demo_mode', 'true');
          window.location.href = 'portal.html';
          return;
        }

        if (!supabaseClient) {
          errorMsg.textContent = "Supabase is not configured. Use the demo account: admin@viiongroup.com / demo123";
          errorMsg.style.display = 'block';
          return;
        }
        
        loginBtn.innerHTML = 'Signing in...';
        loginBtn.style.opacity = '0.7';
        errorMsg.style.display = 'none';

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
          loginBtn.innerHTML = 'Sign In <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>';
          loginBtn.style.opacity = '1';
        } else {
          // Success
          window.location.href = 'portal.html';
        }
      });
    });
  </script>
</body>
</html>
